services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: alert-engine-kafka
    ports:
      - "29092:9092"
      - "29094:29094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: '4L622nShTZaJleqqzsWhFw'

  flink-jobmanager:
    image: flink:1.20-java17
    container_name: alert-engine-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./flink-job/target:/opt/flink/jars
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.bind-host: 0.0.0.0
        jobmanager.memory.process.size: 800m
        rest.bind-address: 0.0.0.0
        rest.address: 0.0.0.0
        parallelism.default: 1
        pekko.ask.timeout: 60s
        web.timeout: 60000
    depends_on:
      - kafka

  flink-taskmanager:
    image: flink:1.20-java17
    container_name: alert-engine-taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.bind-host: 0.0.0.0
        taskmanager.host: flink-taskmanager
        taskmanager.memory.process.size: 1100m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        pekko.ask.timeout: 60s
    depends_on:
      - flink-jobmanager
