apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  namespace: kafka-enterprise
  labels:
    app: kafbat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
      - name: kafbat-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_CONFIG_ADDITIONAL_LOCATION
          value: optional:file:/etc/kafkaui/config.yml
        - name: AUTH_TYPE
          value: DISABLED
        - name: KAFKA_CLUSTERS_0_NAME
          value: enterprise-kafka
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: enterprise-kafka-kafka-bootstrap.kafka-enterprise.svc.cluster.local:9095
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
          value: SASL_PLAINTEXT
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
          value: SCRAM-SHA-512
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: admin
              key: sasl.jaas.config
        - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
          value: http://karapace-schema-registry.kafka-enterprise.svc.cluster.local:8081
        - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME
          value: enterprise-connect
        - name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS
          value: http://kafka-connect.kafka-enterprise.svc.cluster.local:8083
        resources:
          requests:
            cpu: 150m
            memory: 384Mi
          limits:
            cpu: 800m
            memory: 768Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/kafkaui
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 15
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 15
      volumes:
      - name: config-volume
        configMap:
          name: kafbat-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  namespace: kafka-enterprise
spec:
  type: NodePort
  selector:
    app: kafbat-ui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
