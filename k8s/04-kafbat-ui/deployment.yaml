apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  namespace: kafka-enterprise
  labels:
    app: kafbat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
      - name: keycloak-proxy
        image: alpine/socat:latest
        args: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:keycloak.kafka-enterprise.svc.cluster.local:8080"]
      - name: kafbat-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: LOGGING_LEVEL_COM_PROVECTUS_KAFKA_UI
          value: DEBUG
        - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
          value: DEBUG
        - name: SPRING_CONFIG_ADDITIONAL_LOCATION
          value: optional:file:/etc/kafkaui/config.yml
        - name: AUTH_TYPE
          value: OAUTH2
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_PROVIDER
          value: oauth
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENT_ID
          value: kafka-ui
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENT_SECRET
          value: kafka-ui-secret
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_ISSUER_URI
          value: http://localhost:8081/realms/enterprise-kafka
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_USER_NAME_ATTRIBUTE
          value: preferred_username
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_SCOPE
          value: openid,profile,roles,email
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CUSTOM_PARAMS_TYPE
          value: oauth
        - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CUSTOM_PARAMS_ROLES_FIELD
          value: groups
        - name: KAFKA_CLUSTERS_0_NAME
          value: enterprise-kafka
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: enterprise-kafka-kafka-bootstrap.kafka-enterprise.svc.cluster.local:9095
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
          value: SASL_PLAINTEXT
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
          value: SCRAM-SHA-512
        - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: admin
              key: sasl.jaas.config
        volumeMounts:
        - name: config-volume
          mountPath: /etc/kafkaui
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: config-volume
        configMap:
          name: kafbat-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  namespace: kafka-enterprise
spec:
  type: NodePort
  selector:
    app: kafbat-ui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
