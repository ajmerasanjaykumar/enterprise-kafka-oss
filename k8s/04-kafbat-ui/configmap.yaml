apiVersion: v1
kind: ConfigMap
metadata:
  name: kafbat-ui-config
  namespace: kafka-enterprise
data:
  config.yml: |
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            provider: oauth
            client-id: kafka-ui
            client-secret: kafka-ui-secret
            issuer-uri: http://localhost:8081/realms/enterprise-kafka
            user-name-attribute: preferred_username
            scope:
              - openid
              - profile
              - roles
              - email
            custom-params:
              type: oauth
              roles-field: groups

    rbac:
      roles:
        - name: AdminRole
          clusters:
            - enterprise-kafka
          subjects:
            - provider: oauth
              type: role
              value: Kafka_Admins
            - provider: oauth
              type: group
              value: Kafka_Admins
            - provider: oauth
              type: user
              value: admin
          permissions:
            - resource: topic
              value: ".*"
              actions: [all]
            - resource: clusterconfig
              actions: [all]
            - resource: consumer
              value: ".*"
              actions: [all]
            - resource: acl
              actions: [all]

        - name: EquitiesRole
          clusters:
            - enterprise-kafka
          subjects:
            - provider: oauth
              type: role
              value: Equities_Team
            - provider: oauth
              type: group
              value: Equities_Team
            - provider: oauth
              type: user
              value: equities
            - provider: oauth
              type: user
              value: equities-user
          permissions:
            - resource: clusterconfig
              actions: [view]
            - resource: topic
              value: "equities-.*"
              actions: [all]
            - resource: acl
              actions: [view]

        - name: FIRole
          clusters:
            - enterprise-kafka
          subjects:
            - provider: oauth
              type: role
              value: FI_Team
            - provider: oauth
              type: group
              value: FI_Team
            - provider: oauth
              type: user
              value: fi
            - provider: oauth
              type: user
              value: fi-user
          permissions:
            - resource: clusterconfig
              actions: [view]
            - resource: topic
              value: "fi-.*"
              actions: [all]
            - resource: acl
              actions: [view]
