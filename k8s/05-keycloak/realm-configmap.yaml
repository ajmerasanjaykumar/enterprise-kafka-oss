apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: kafka-enterprise
data:
  realm-export.json: |
    {
      "realm": "enterprise-kafka",
      "enabled": true,
      "roles": {
        "realm": [
          { "name": "Kafka_Admins" },
          { "name": "Equities_Team" },
          { "name": "FI_Team" }
        ]
      },
      "groups": [
        {
          "name": "Kafka_Admins",
          "realmRoles": ["Kafka_Admins"]
        },
        {
          "name": "Equities_Team",
          "realmRoles": ["Equities_Team"]
        },
        {
          "name": "FI_Team",
          "realmRoles": ["FI_Team"]
        }
      ],
      "users": [
        {
          "username": "admin",
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@enterprise.local",
          "emailVerified": true,
          "enabled": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "admin123", "temporary": false }],
          "realmRoles": ["Kafka_Admins"],
          "groups": ["Kafka_Admins"]
        },
        {
          "username": "equities-user",
          "firstName": "Equities",
          "lastName": "User",
          "email": "equities-user@enterprise.local",
          "emailVerified": true,
          "enabled": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "equities123", "temporary": false }],
          "realmRoles": ["Equities_Team"],
          "groups": ["Equities_Team"]
        },
        {
          "username": "equities",
          "firstName": "Equities",
          "lastName": "Team",
          "email": "equities@enterprise.local",
          "emailVerified": true,
          "enabled": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "equities123", "temporary": false }],
          "realmRoles": ["Equities_Team"],
          "groups": ["Equities_Team"]
        },
        {
          "username": "fi-user",
          "firstName": "FI",
          "lastName": "User",
          "email": "fi-user@enterprise.local",
          "emailVerified": true,
          "enabled": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "fi123", "temporary": false }],
          "realmRoles": ["FI_Team"],
          "groups": ["FI_Team"]
        },
        {
          "username": "fi",
          "firstName": "FI",
          "lastName": "Team",
          "email": "fi@enterprise.local",
          "emailVerified": true,
          "enabled": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "fi123", "temporary": false }],
          "realmRoles": ["FI_Team"],
          "groups": ["FI_Team"]
        }
      ],
      "clients": [
        {
          "clientId": "kafka-ui",
          "secret": "kafka-ui-secret",
          "enabled": true,
          "publicClient": false,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            },
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "roles",
                "multivalued": "true"
              }
            }
          ]
        }
      ]
    }
