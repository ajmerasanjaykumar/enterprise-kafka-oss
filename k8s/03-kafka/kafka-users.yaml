apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  namespace: kafka-enterprise
  labels:
    strimzi.io/cluster: enterprise-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: cluster
        operations:
          - All
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: team-a-manager
  namespace: kafka-enterprise
  labels:
    strimzi.io/cluster: enterprise-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "team-a-"
          patternType: prefix
        operations:
          - All
      - resource:
          type: group
          name: "team-a-"
          patternType: prefix
        operations:
          - All
      - resource:
          type: cluster
        operations:
          - Create
          - Describe
---
